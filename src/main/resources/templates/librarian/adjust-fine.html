<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Adjust Fine')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4" style="max-width: 720px;">
  <h3 class="mb-3">Waive / Adjust Fine</h3>
  <div class="card mb-3"><div class="card-body">
    <div class="mb-2">
      <strong th:text="${view.fine.borrowRecord.user.name}">User</strong> -
      <span th:text="${view.fine.borrowRecord.book.title}">Book</span>
      <span th:replace="~{fragments/layout :: fineBadge(${view.fine.status})}"></span>
    </div>
    <table class="table table-sm mb-0">
      <tr><td>Original fine</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.fine.amount, 1, 2)}"></td></tr>
      <tr><td>Waived so far</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.adjusted, 1, 2)}"></td></tr>
      <tr><td>Paid (successful)</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.paid, 1, 2)}"></td></tr>
      <tr class="fw-bold"><td>Outstanding</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.outstanding, 1, 2)}"></td></tr>
    </table>
  </div></div>
  <form th:if="${view.outstanding.signum() > 0}" th:action="@{/librarian/fines/{id}/adjust(id=${view.fine.id})}"
        th:object="${form}" method="post" class="mb-4">
    <div class="mb-3"><label class="form-label">Amount to waive (₹, up to the outstanding balance)</label>
      <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{amount}"
             th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{amount}"></div></div>
    <div class="mb-3"><label class="form-label">Reason (required, recorded with your name)</label>
      <input class="form-control" maxlength="255" th:field="*{reason}"
             th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{reason}"></div></div>
    <button class="btn btn-warning" type="submit">Record adjustment</button>
    <a class="btn btn-link" th:href="@{/librarian/fines}">Back</a>
  </form>
  <a th:unless="${view.outstanding.signum() > 0}" class="btn btn-link" th:href="@{/librarian/fines}">Back</a>
  <h5>Adjustment history</h5>
  <table class="table table-sm">
    <thead><tr><th>Date</th><th>Amount</th><th>Reason</th><th>Librarian</th></tr></thead>
    <tbody>
      <tr th:each="a : ${history}">
        <td th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td th:text="'₹' + ${#numbers.formatDecimal(a.amount, 1, 2)}"></td>
        <td th:text="${a.reason}"></td>
        <td th:text="${a.librarian.email}"></td>
      </tr>
      <tr th:if="${history.isEmpty()}"><td colspan="4" class="text-muted text-center">No adjustments.</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
