<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Manage Books')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h3 class="m-0">Books</h3>
    <a class="btn btn-primary" th:href="@{/librarian/books/new}">Add book</a>
  </div>
  <form class="row g-2 mb-3" method="get" th:action="@{/librarian/books}">
    <div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search title, author or ISBN"></div>
    <div class="col-auto"><button class="btn btn-secondary" type="submit">Search</button></div>
  </form>
  <table class="table table-striped align-middle">
    <thead><tr><th>ISBN</th><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th></th></tr></thead>
    <tbody>
      <tr th:each="b : ${books}">
        <td th:text="${b.isbn}"></td><td th:text="${b.title}"></td><td th:text="${b.author}"></td>
        <td th:text="${b.category} ?: '-'"></td>
        <td th:text="${b.availableCopies} + ' / ' + ${b.totalCopies}"></td>
        <td class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/librarian/books/{id}/edit(id=${b.id})}">Edit</a>
          <form th:action="@{/librarian/books/{id}/delete(id=${b.id})}" method="post"
                onsubmit="return confirm('Delete this book?');">
            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:if="${books.isEmpty()}"><td colspan="6" class="text-center text-muted">No books found.</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
