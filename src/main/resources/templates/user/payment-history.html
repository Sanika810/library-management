<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Payment History')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4">
  <h3 class="mb-3">Payment History</h3>
  <table class="table table-striped align-middle">
    <thead><tr><th>Date</th><th>Book</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction reference</th></tr></thead>
    <tbody>
      <tr th:each="p : ${payments}">
        <td th:text="${#temporals.format(p.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td th:text="${p.fine.borrowRecord.book.title}"></td>
        <td th:text="'₹' + ${#numbers.formatDecimal(p.amount, 1, 2)}"></td>
        <td th:text="${p.method}"></td>
        <td><span th:replace="~{fragments/layout :: payBadge(${p.status})}"></span></td>
        <td th:text="${p.transactionReference} ?: '-'"></td>
      </tr>
      <tr th:if="${payments.isEmpty()}"><td colspan="6" class="text-center text-muted">No payments yet.</td></tr>
    </tbody>
  </table>
  <p class="text-muted small">All payments are simulated (demonstration only).</p>
</div>
</body>
</html>
