<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Books')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="m-0">My Borrowed Books</h3>
    <a th:href="@{/user/fines}" class="btn btn-outline-danger"
       th:if="${outstandingTotal.signum() > 0}"
       th:text="'Outstanding fines: ₹' + ${#numbers.formatDecimal(outstandingTotal, 1, 2)}">Fines</a>
  </div>
  <p class="text-muted">Loan period is 14 days. Late returns are fined per overdue day.</p>
  <table class="table table-striped align-middle">
    <thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Returned</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr th:each="r : ${records}">
        <td th:text="${r.book.title}">Title</td>
        <td th:text="${r.borrowDate}"></td>
        <td th:text="${r.dueDate}"></td>
        <td th:text="${r.returnDate} ?: '-'"></td>
        <td>
          <span class="badge bg-success" th:if="${r.status.name() == 'RETURNED'}">RETURNED</span>
          <span class="badge bg-danger" th:if="${r.status.name() == 'BORROWED' and r.dueDate.isBefore(today)}">OVERDUE</span>
          <span class="badge bg-primary" th:if="${r.status.name() == 'BORROWED' and !r.dueDate.isBefore(today)}">BORROWED</span>
        </td>
        <td>
          <form th:if="${r.status.name() == 'BORROWED'}" th:action="@{/user/return/{id}(id=${r.id})}" method="post">
            <button class="btn btn-sm btn-primary" type="submit">Return</button>
          </form>
        </td>
      </tr>
      <tr th:if="${records.isEmpty()}"><td colspan="6" class="text-center text-muted">You have not borrowed any books yet.</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
