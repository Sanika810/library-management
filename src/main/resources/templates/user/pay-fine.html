<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Pay Fine')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4" style="max-width: 640px;">
  <h3 class="mb-3">Pay Fine</h3>
  <div class="alert alert-warning">
    <strong>Simulated payment.</strong> This is a demonstration; no real UPI, card or bank transaction takes place.
  </div>
  <div class="card mb-3"><div class="card-body">
    <div class="mb-2"><strong th:text="${view.fine.borrowRecord.book.title}">Book</strong>
      <span th:replace="~{fragments/layout :: fineBadge(${view.fine.status})}"></span></div>
    <table class="table table-sm mb-0">
      <tr><td>Original fine</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.fine.amount, 1, 2)}"></td></tr>
      <tr><td>Waived</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.adjusted, 1, 2)}"></td></tr>
      <tr><td>Paid</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.paid, 1, 2)}"></td></tr>
      <tr class="fw-bold"><td>Outstanding</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(view.outstanding, 1, 2)}"></td></tr>
    </table>
  </div></div>
  <form th:action="@{/user/fines/{id}/pay(id=${view.fine.id})}" th:object="${form}" method="post">
    <input type="hidden" th:field="*{idempotencyKey}">
    <div class="alert alert-danger" th:if="${#fields.hasErrors('idempotencyKey')}">Invalid payment request. Reload the page.</div>
    <div class="mb-3"><label class="form-label">Amount (₹)</label>
      <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{amount}"
             th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{amount}"></div></div>
    <div class="mb-3"><label class="form-label">Payment method (simulated)</label>
      <select class="form-select" th:field="*{method}" th:classappend="${#fields.hasErrors('method')} ? 'is-invalid'">
        <option value="">Select...</option>
        <option th:each="m : ${methods}" th:value="${m}" th:text="${m}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{method}"></div></div>
    <button class="btn btn-primary" type="submit">Pay (simulated)</button>
    <a class="btn btn-link" th:href="@{/user/fines}">Cancel</a>
  </form>
</div>
</body>
</html>
