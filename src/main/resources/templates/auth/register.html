<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4" style="max-width: 420px;">
  <h3 class="mb-3">Register</h3>
  <form th:action="@{/register}" th:object="${form}" method="post">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{name}"></div></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{email}"></div></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{password}"></div></div>
    <button class="btn btn-primary w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3">Already registered? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
