<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: nav}"></th:block>
<div class="container py-4" style="max-width: 420px;">
  <h3 class="mb-3">Login</h3>
  <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
  <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <p class="mt-3">New here? <a th:href="@{/register}">Create an account</a></p>
</div>
</body>
</html>
