spring.application.name=library-management
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.port=8080
server.error.include-message=always

# Seeded librarian account (created on first start if no librarian exists)
app.librarian.email=librarian@library.com
app.librarian.password=Librarian@123

# SIMULATED payment processor: probability (0.0-1.0) that a payment fails
app.payment.simulated.failure-rate=0.1
